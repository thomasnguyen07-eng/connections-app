workflows:
  ios-app:
    name: iOS App
    environment:
      xcode: latest
      node: 20
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Install Capacitor iOS
        script: npm install @capacitor/ios
      - name: Sync Capacitor (generate iOS project)
        script: npx cap sync ios
      - name: Build iOS app
        script: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -sdk iphoneos -configuration Release archive -archivePath ./build/App.xcarchive
          mkdir -p ./build
          xcodebuild -exportArchive -archivePath ./build/App.xcarchive -exportPath ./build -exportOptionsPlist ./exportOptions.plist
    artifacts:
      - ios/App/build/*.ipa
