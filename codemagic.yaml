workflows:
  ios-app:
    name: iOS App
    environment:
      xcode: latest
      node: 22
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Install Capacitor iOS
        script: npm install @capacitor/ios
      - name: Sync Capacitor
        script: npx cap sync ios
      - name: Build iOS app
        script: |
          cd ios/App
          xcodebuild -workspace App.xcodeproj/project.xcworkspace -scheme App -sdk iphoneos -configuration Release archive -archivePath build/App.xcarchive CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO
          mkdir -p build
          echo '<?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>signingStyle</key>
            <string>manual</string>
          </dict>
          </plist>' > build/exportOptions.plist
          xcodebuild -exportArchive -archivePath build/App.xcarchive -exportPath build -exportOptionsPlist build/exportOptions.plist
    artifacts:
      - ios/App/build/App.ipa
