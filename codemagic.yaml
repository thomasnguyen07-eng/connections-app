workflows:
  ios-app:
    name: iOS App
    environment:
      xcode: latest
      node: 22
    scripts:
      - name: Check Node version
        script: node --version
      - name: Install dependencies
        script: npm install
      - name: Install Capacitor iOS
        script: npm install @capacitor/ios
      - name: Sync Capacitor
        script: npx cap sync ios
      - name: List root directory
        script: ls -la
      - name: List ios directory
        script: ls -la ios/
      - name: List ios/App directory
        script: ls -la ios/App/
      - name: Find xcworkspace file
        script: find . -name "*.xcworkspace"
      - name: Create exportOptions.plist
  script: |
    cat > ios/App/exportOptions.plist << EOF
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
    <plist version="1.0">
    <dict>
      <key>method</key>
      <string>app-store</string>
      <key>teamID</key>
      <string>S67PVB76PN</string>
      <key>provisioningProfiles</key>
      <dict/>
    </dict>
    </plist>
    EOF
      - name: Build iOS app
        script: |
          cd ios/App
          xcodebuild -workspace App.xcodeproj/project.xcworkspace -scheme App -sdk iphoneos -configuration Release archive -archivePath build/App.xcarchive
          xcodebuild -exportArchive -archivePath build/App.xcarchive -exportPath build -exportOptionsPlist exportOptions.plist
    artifacts:
      - ios/App/build/App.ipa
