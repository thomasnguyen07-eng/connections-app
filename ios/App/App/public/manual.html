      }
      .warning {

        border-radius: 8px;

      }
      footer {
        text-align: center;
        padding: 20px;
        background: #f5f5f5;
        color: #666;

        .content {
          padding: 20px;
        }

          padding: 6px 12px;
          font-size: 12px;
        }

      let currentLang = "en";

      function setLanguage(lang) {
        currentLang = lang;
        const t = translations[lang];
        if (!t) return;

        let html = `<h1>${t.title}</h1>`;

        t.sections.forEach((section) => {
          html += `<h2>${section.title}</h2>`;
          html += `<div class="step"><ul>`;
          section.steps.forEach((step) => {
            html += `<li>${step}</li>`;
          });
          html += `</ul></div>`;
          if (section.tips) {
            html += `<div class="tip"><strong>💡 Tips:</strong><ul>`;
            section.tips.forEach((tip) => {
              html += `<li>${tip}</li>`;
            });
            html += `</ul></div>`;
          }
          if (section.warnings) {
            html += `<div class="warning"><strong>⚠️ Warnings:</strong><ul>`;
            section.warnings.forEach((warning) => {
              html += `<li>${warning}</li>`;
            });
            html += `</ul></div>`;
          }
          if (section.deleteNote) {
            html += `<div class="tip"><strong>🗑️ Delete:</strong> ${section.deleteNote}</div>`;
          }
        });

        html += `<h2>${t.violations.title}</h2>`;
        html += `<div class="warning"><ul>`;
        t.violations.warnings.forEach((warning) => {
          html += `<li>${warning}</li>`;
        });
        html += `</ul>`;
        html += `<p><strong>${t.violations.consequences}</strong></p>`;
        html += `<p>${t.violations.appeal}</p></div>`;

        document.getElementById("content").innerHTML = html;
        document.getElementById("footerText").textContent = t.footer;

        document.querySelectorAll(".lang-btn").forEach((btn) => {
          if (btn.dataset.lang === lang) btn.classList.add("active");
          else btn.classList.remove("active");
        });
      }

      document.querySelectorAll(".lang-btn").forEach((btn) => {
        btn.addEventListener("click", () => setLanguage(btn.dataset.lang));
      });

      const savedLang = localStorage.getItem("manualLanguage") || "en";
      setLanguage(savedLang);

      document.getElementById("langBar").addEventListener("click", (e) => {
        if (e.target.dataset.lang)
          localStorage.setItem("manualLanguage", e.target.dataset.lang);
      });
    </script>
